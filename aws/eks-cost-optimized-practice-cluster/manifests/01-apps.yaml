# Two tiny apps exposed through ClusterIP Services
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:stable-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
          lifecycle:
            preStop: # lets the ALB deregister the pod before it stops (avoids 502s on rollout)
              exec: { command: ["sleep", "15"] }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  type: ClusterIP
  selector: { app: web }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: echo }
  template:
    metadata:
      labels: { app: echo }
    spec:
      containers:
        - name: echo
          image: public.ecr.aws/docker/library/busybox:stable # ECR Public: no Docker Hub rate limits
          command: ["sh", "-c"]
          args:
            - mkdir -p /www/echo &&
              echo "hello from the echo service ($(hostname))" | tee /www/index.html > /www/echo/index.html &&
              httpd -f -p 5678 -h /www
          ports: [{ containerPort: 5678 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: demo
spec:
  type: ClusterIP
  selector: { app: echo }
  ports: [{ port: 80, targetPort: 5678 }]
